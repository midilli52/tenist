<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12304f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tenist">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14212e;--mut:#5d6d7c;--line:#d3dce4;--sb:#12304f;--a:#1d5fa8;--b:#a8327d;--ball:#d6e53b;--bad:#b42318;--badbg:#fdecea;--btn:#f6f9fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161e;--card:#17222d;--ink:#e8eef3;--mut:#93a4b3;--line:#2b3a48;--sb:#0a2038;--a:#6aa8ee;--b:#e48ac2;--bad:#ff8a7d;--badbg:#3a1d1a;--btn:#1d2b38}}
:root[data-theme="dark"]{--bg:#0e161e;--card:#17222d;--ink:#e8eef3;--mut:#93a4b3;--line:#2b3a48;--sb:#0a2038;--a:#6aa8ee;--b:#e48ac2;--bad:#ff8a7d;--badbg:#3a1d1a;--btn:#1d2b38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Barlow Semi Condensed",system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;color:var(--mut);font-size:14px}
h1{font-size:28px;margin:6px 0 12px}h3{margin:0 0 6px;font-size:17px}
button,select,input{font:inherit;color:var(--ink)}
button{min-height:46px;border:1.5px solid var(--line);background:var(--btn);border-radius:10px;padding:6px 10px;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.4}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:1px}
.ghost{min-height:36px;border:0;background:none;color:var(--a);font-weight:600;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;margin:8px 0 3px;color:var(--mut);font-size:14px}
select,input{width:100%;min-height:44px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:14px;background:var(--sb);color:#fff;border-color:var(--sb);font-weight:700;font-size:18px}
.sb{background:var(--sb);color:#fff;border-radius:12px;padding:6px 12px;margin-bottom:10px}
.r{display:grid;grid-template-columns:16px 1fr repeat(var(--n),30px) 40px 56px;align-items:center;gap:4px;padding:8px 0;font-size:22px;font-weight:700}
.r+.r{border-top:1px solid rgba(255,255,255,.2)}
.r .nm{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .s{text-align:center;opacity:.75}.r .g{text-align:center}.r .p{text-align:center;background:var(--ball);color:#12304f;border-radius:6px;padding:2px 0}
.dot{color:var(--ball);font-size:13px}
.srv{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start}
.c0 h3{color:var(--a)}.c1 h3{color:var(--b)}
.col button.e{background:var(--badbg);border-color:transparent;color:var(--bad)}
.col button.k{font-weight:700}
.bar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.hint{color:var(--mut);font-size:13px;margin:8px 2px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
td:first-child,th:first-child{text-align:left;color:var(--mut)}th{font-size:17px}th:nth-child(2){color:var(--a)}th:nth-child(3){color:var(--b)}
.hl{font-weight:700}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}.it small{color:var(--mut);display:block}
.it .ac{display:flex;gap:6px}.it button{min-height:38px}
.tip b{display:block;margin-top:8px}.tip ul{margin:4px 0 0;padding-left:20px}
.end{text-align:center;font-size:20px;font-weight:700;padding:12px}
.mic{width:100%;font-weight:700}.mic.on{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DB=[],cur=null,view="home",armed=0,vOn=false,vMsg="";
try{DB=JSON.parse(localStorage.getItem("tn1")||"[]")}catch(e){DB=[]}
const save=()=>{try{localStorage.setItem("tn1",JSON.stringify(DB))}catch(e){}};

function replay(m){const c=m.cfg,G=c.games,tbAt=c.adv?99:c.v?(c.t3?G-1:G):G==6?6:G-1,tbTo=c.v?7:G==6?7:5,need=Math.ceil(c.sets/2);
const S={sets:[],g:[0,0],p:[0,0],tb:false,tot:0,sw:[0,0],done:false,f1:false,st:[0,1].map(()=>({ace:0,df:0,w:0,ue:0,fe:0,s1n:0,s1w:0,s2n:0,s2w:0,rn:0,rw:0,bpo:0,bpc:0,pw:0,gw:0}))};
const srv=()=>S.tb?(((m.first+S.tot)%2)+((S.p[0]+S.p[1]+1)>>1))%2:(m.first+S.tot)%2;
const wins=(x,y)=>S.tb?x>=(S.mt?10:tbTo)&&x-y>=2:(c.noad?x>=4:x>=4&&x-y>=2);
for(const e of m.ev){if(S.done)break;
 if(e.t=="f1"){S.f1=true;continue}
 const sv=srv(),r=1-sv,t=S.st,w=(e.t=="df"||e.t=="ue"||e.t=="fe")?1-e.p:e.p,s1=!S.f1&&e.t!="df";
 if(e.t!="pt")t[e.p][e.t]++;
 t[w].pw++;t[sv][s1?"s1n":"s2n"]++;if(w==sv)t[sv][s1?"s1w":"s2w"]++;
 t[r].rn++;if(w==r)t[r].rw++;
 if(!S.tb&&wins(S.p[r]+1,S.p[sv])){t[r].bpo++;if(w==r)t[r].bpc++}
 S.p[w]++;S.f1=false;
 if(wins(S.p[w],S.p[1-w])){const wasTb=S.tb,mt=S.mt,pp=[...S.p];if(!mt){S.g[w]++;t[w].gw++}S.tot++;S.p=[0,0];S.tb=false;
  if(wasTb||(S.g[w]>=G&&S.g[w]-S.g[1-w]>=2)){S.sets.push(mt?pp:S.g);S.sw[w]++;S.g=[0,0];if(S.sw[w]>=need)S.done=true;else if(c.mtb&&need==2&&S.sw[0]==1&&S.sw[1]==1){S.tb=true;S.mt=true}}
  else if(S.g[0]==tbAt&&S.g[1]==tbAt)S.tb=true}}
S.srv=srv();if(m.res&&!S.done)applyRes(S,m);return S}

function applyRes(S,m){const c=m.cfg,G=c.games,r=m.res.l,w=1-r,need=Math.ceil(c.sets/2),adv=!!c.adv,ret=m.res.t=="RET";
 const sets=ret?S.sets.map(x=>x.slice()):[],sw=ret?S.sw.slice():[0,0];
 const add=(rg,wg)=>{const a=[0,0];a[r]=rg;a[w]=wg;sets.push(a);sw[w]++};
 if(ret){const cg=S.mt?S.p:S.g,rg=cg[r],wg=cg[w];add(rg,S.mt?Math.max(wg,10,rg+2):(rg>=G&&!adv?G+1:Math.max(wg,G,rg+2)))}
 while(sw[w]<need)add(0,c.mtb&&need==2&&sw[0]==1&&sw[1]==1?10:G);
 S.sets=sets;S.sw=sw;S.g=[0,0];S.p=[0,0];S.tb=false;S.mt=false;S.done=true;S.res=m.res}
const pd=(S,i)=>{const a=S.p[i],b=S.p[1-i];if(S.tb)return a;if(a>=3&&b>=3)return a==b?40:(a>b?"Ad":40);return[0,15,30,40][a]};
const cfgText=m=>(m.cfg.games==6?(m.cfg.adv?"6 game avantaj seti":"6 game"):(m.cfg.t3?"4 game (3-3 tiebreak)":"4 game"))+" · "+m.cfg.sets+" set"+(m.cfg.noad?" · karar":"")+(m.cfg.mtb&&m.cfg.sets==3?" · 3. set 10 puan":"");
const setTxt=m=>{const S=replay(m);return(S.sets.map(s=>s[0]+"-"+s[1]).join(" ")||"başlamadı")+(S.res?" "+S.res.t:"")};
const go=v=>{if(vOn){vOn=false;if(DICT)DICT.stop().catch(()=>{});else try{rec.stop()}catch(e){}}view=v;armed=0;render();scrollTo(0,0)};

function start(){const m={id:Date.now(),d:new Date().toLocaleDateString("tr-TR"),n:[$("#n0").value.trim()||"Oyuncu 1",$("#n1").value.trim()||"Oyuncu 2"],cfg:{games:parseInt($("#g").value),adv:$("#g").value=="6a",t3:$("#g").value=="4b",sets:+$("#s").value,noad:$("#na").value=="1",mtb:$("#m").value=="1",v:2},first:+$("#f").value,ev:[]};
DB.unshift(m);cur=m;save();go("match")}
function openM(id,v){cur=DB.find(m=>m.id==id);go(v)}
function del(id){if(armed!=id){armed=id;render();return}DB=DB.filter(m=>m.id!=id);armed=0;save();render()}
function add(t,p){if(cur.fin)return;cur.ev.push({t,p});save();render()}
function undo(){if(cur.res){cur.res=null;save();render();return}cur.ev.pop();cur.fin=false;save();render()}
function fin(){cur.fin=true;save();go("stats")}

function home(){return`<h1>Tenist</h1><div class="card"><h3>Yeni maç</h3>
<div class="two"><div><label>1. oyuncu</label><input id="n0" placeholder="Oyuncu 1"></div><div><label>2. oyuncu</label><input id="n1" placeholder="Oyuncu 2"></div></div>
<label>Maç türü (hazır ayar)</label><select id="pr" onchange="preset(this.value)"><option value="">Özel (kendim seçeyim)</option><option value="a">Tekler ana tablo (12 yaş ve üzeri)</option><option value="b">Tekler eleme ve teselli</option><option value="c">Çiftler / karışık çiftler</option><option value="d">9-10 yaş (kısa set)</option></select>
<div class="two"><div><label>Set türü</label><select id="g" onchange="$('#m0').textContent='3. set '+parseInt(this.value)+' game'"><option value="6" selected>6 game, 6-6’da tiebreak</option><option value="6a">6 game, avantaj seti</option><option value="4">4 game, 4-4’te tiebreak</option><option value="4b">4 game, 3-3’te tiebreak</option></select></div>
<div><label>Maç</label><select id="s"><option value="1">1 set</option><option value="3">3 set (2 set kazanan)</option><option value="5">5 set (3 set kazanan)</option></select></div></div>
<div class="two"><div><label>Deuce</label><select id="na"><option value="0">Avantaj</option><option value="1">Karar</option></select></div>
<div><label>İlk servis</label><select id="f"><option value="0">1. oyuncu</option><option value="1">2. oyuncu</option></select></div></div>
<label>Set Eşitliği</label><select id="m"><option id="m0" value="0">3. set 6 game</option><option value="1">3. set 10 puan</option></select><p class="hint">Tiebreak 7 sayılıktır, 2 sayı fark gerekir. 6 game’lik sette 5-5’te 7-5’e, kısa sette 3-3’te 5-3’e uzar. Avantaj setinde tiebreak yoktur, 2 game fark gerekir.</p>
<button class="go" onclick="start()">Maça başla</button></div>
<div class="card"><h3>Kayıtlı maçlar</h3>`+(DB.length?DB.map(m=>`<div class="it"><div><b>${esc(m.n[0])} – ${esc(m.n[1])}</b><small>${m.d} · ${cfgText(m)} · ${setTxt(m)}</small></div><div class="ac"><button onclick="openM(${m.id},'${replay(m).done||m.fin?"stats":"match"}')">${replay(m).done||m.fin?"İstatistik":"Devam"}</button><button onclick="del(${m.id})">${armed==m.id?"Emin misin?":"Sil"}</button></div></div>`).join(""):`<p class="hint">Henüz maç yok. Yukarıdan yeni bir maç başlat.</p>`)+`<div class="two" style="margin-top:10px"><button onclick="exp()">Yedeği indir</button><button onclick="$('#imp').click()">Yedeği yükle</button><input id="imp" type="file" accept=".json,application/json" hidden onchange="imp(this)"></div></div>`}

function board(S,n){const cols=S.sets.length+(S.done?0:1);
return`<div class="sb">`+[0,1].map(i=>`<div class="r" style="--n:${S.sets.length}"><span class="dot">${S.srv==i&&!S.done?"●":""}</span><span class="nm">${esc(n[i])}</span>${S.sets.map(s=>`<span class="s">${s[i]}</span>`).join("")}<span class="g">${S.done?S.sw[i]:S.g[i]}</span><span class="p">${S.done?"":pd(S,i)}</span></div>`).join("")+`</div>`}

function entry(S,n){const sv=S.srv,b=(t,i,l,c)=>`<button class="${c||""}" onclick="add('${t}',${i})">${l}</button>`;
return`<div class="srv"><span>Servis: <b>${esc(n[sv])}</b> · ${S.f1?"2. servis":"1. servis"}${S.tb?(S.mt?" · maç tiebreak (10)":" · tiebreak"):""}</span><button onclick="add('f1',${sv})" ${S.f1?"disabled":""}>1. servis hata</button></div><div class="cols">`+
[0,1].map(i=>`<div class="col c${i}"><h3>${esc(n[i])}</h3>`+(i==sv?b("ace",i,"Ace","k")+b("df",i,"Çift hata","e"):"")+b("w",i,"Winner","k")+b("pt",i,"Sayı kazandı")+b("ue",i,"Basit hata","e")+b("fe",i,"Zorlanmış hata","e")+`</div>`).join("")+`</div>${cur.cfg.noad&&!S.tb&&S.p[0]==3&&S.p[1]==3?'<p class="hint"><b>Karar sayısı.</b> Karşılayan oyuncu servisin hangi tarafa atılacağını seçer.</p>':""}<p class="hint">Hata butonları sayıyı rakibe yazar. Servis atanın sayıları kendi sütununda görünür.</p>`}

function matchV(){const S=replay(cur),n=cur.n,over=S.done||cur.fin;
return`<header><button class="ghost" onclick="go('home')">‹ Maçlar</button><span>${cfgText(cur)}</span></header>`+board(S,n)+
(over?`<p class="end">${S.done?esc(n[S.sw[0]>S.sw[1]?0:1])+" maçı kazandı"+(S.res?" ("+S.res.t+")":""):"Maç sonlandırıldı"}</p>`:micB()+entry(S,n))+
(resOpen&&!over?resB(n):"")+`<div class="bar"><button onclick="undo()" ${cur.ev.length||cur.res?"":"disabled"}>Geri al</button><button onclick="go('stats')">İstatistikler</button><button onclick="fin()" ${over?"disabled":""}>Maçı bitir</button><button onclick="resP()" ${over?"disabled":""}>Hükmen / çekilme</button></div>`}

const pc=(a,n)=>n?Math.round(100*a/n)+"% ("+a+"/"+n+")":"–";
function tips(S,n){const o=[];S.st.forEach((t,i)=>{const x=[],sp=t.s1n+t.s2n;
 if(sp>=10&&t.s1n/sp<.55)x.push("1. servis oranı düşük (%"+Math.round(100*t.s1n/sp)+"): servis tutarlılığı ve ritmi");
 if(t.df>=3)x.push(t.df+" çift hata: 2. servis güvenliği");
 if(t.s2n>=6&&t.s2w/t.s2n<.4)x.push("2. servis sayıları zayıf ("+t.s2w+"/"+t.s2n+"): derinlik ve dönüş ekleme");
 if(t.ue>=5&&t.ue>t.w)x.push("basit hataları winnerlardan fazla ("+t.ue+" / "+t.w+"): tutarlılık ve hedef seçimi");
 if(t.bpo>=3&&t.bpc/t.bpo<.35)x.push("break pointlerde düşük dönüşüm ("+t.bpc+"/"+t.bpo+"): kritik sayı oyunu");
 if(t.rn>=10&&t.rw/t.rn<.3)x.push("karşılama sayıları düşük ("+t.rw+"/"+t.rn+"): karşılama pozisyonu ve ilk top");
 o.push([n[i],x])});return o}

function statsV(){const S=replay(cur),n=cur.n,[A,B]=S.st,pts=A.pw+B.pw;
const row=(l,f)=>`<tr><td>${l}</td><td>${f(A)}</td><td>${f(B)}</td></tr>`;
return`<header><button class="ghost" onclick="go('${cur.fin||S.done?"home":"match"}')">‹ ${cur.fin||S.done?"Maçlar":"Maça dön"}</button><span>${cur.d} · ${cfgText(cur)}</span></header>
<div class="card"><table><tr><th></th><th>${esc(n[0])}</th><th>${esc(n[1])}</th></tr>
<tr><td>Skor</td><td colspan="2" class="hl">${S.sets.map(s=>s[0]+"-"+s[1]).join("  ")||"–"}${S.done?"":" ("+S.g[0]+"-"+S.g[1]+")"}${S.res?" · "+S.res.t+" ("+esc(n[S.res.l])+")":""}</td></tr>
${row("Toplam sayı",t=>pc(t.pw,pts))}${row("Kazanılan game",t=>t.gw)}${row("Ace",t=>t.ace)}${row("Çift hata",t=>t.df)}
${row("1. servis oranı",t=>pc(t.s1n,t.s1n+t.s2n))}${row("1. servis sayı kazanma",t=>pc(t.s1w,t.s1n))}${row("2. servis sayı kazanma",t=>pc(t.s2w,t.s2n))}
${row("Karşılama sayı kazanma",t=>pc(t.rw,t.rn))}${row("Break point dönüşümü",t=>t.bpo?t.bpc+"/"+t.bpo:"–")}
${row("Winner",t=>t.w)}${row("Basit hata",t=>t.ue)}${row("Zorlanmış hata",t=>t.fe)}</table></div>
<div class="card tip"><h3>Antrenmanda bakılacak noktalar</h3>`+(pts<20?`<p class="hint">Daha net sonuçlar için en az 20 sayılık veri gerekir.</p>`:tips(S,n).map(([k,x])=>`<b>${esc(k)}</b>`+(x.length?`<ul>${x.map(y=>`<li>${y}</li>`).join("")}</ul>`:`<p class="hint">Belirgin bir zayıflık görünmüyor.</p>`)).join("")+`<p class="hint">Bu notlar basit kurallarla üretilir; tek maç yerine birkaç maçın eğilimine bakmak daha sağlıklıdır.</p>`)+`</div>`}

const norm=s=>s.toLocaleLowerCase("tr").replace(/[.,!?:;"]/g," ");
function vmsg(s){vMsg=s;const el=$("#vm");if(el)el.textContent=s}
function micB(){return`<button class="mic${vOn?" on":""}" onclick="mic()">${vOn?"🎙 Dinleniyor, durdurmak için dokun":"🎙 Sesli giriş"}</button><p class="hint" id="vm">${esc(vMsg)||"Örnek: “ace”, “çift hata”, “ilk servis hata”, “winner bir”, “basit hata iki”, “zorlanmış hata”, “sayı iki”, “geri al”. Oyuncuyu adıyla ya da bir/iki diye söyle."}</p>`}
function voice(raw){const S=replay(cur);if(S.done||cur.fin)return;const t=norm(raw),k=t.split(/\s+/).filter(Boolean),sv=S.srv,say=l=>vmsg("“"+raw.trim()+"” → "+l);
 if(/geri al|iptal/.test(t)){if(cur.ev.length){say("geri alındı");undo()}return}
 if(t.includes("servis")&&/hata|dışarı|aut|ağ/.test(t)&&!/çift/.test(t)){if(S.f1){say("zaten 2. servis");return}say("1. servis hata");add("f1",sv);return}
 const ty=/çift/.test(t)?"df":/(^|\s)(ace|as|eys|ays)(\s|$)/.test(t)?"ace":/zorlanmış/.test(t)?"fe":/hata/.test(t)?"ue":/winner|viner|vinner|kazanan/.test(t)?"w":/sayı/.test(t)?"pt":"";
 if(!ty){say("anlaşılmadı");return}
 let p=-1;cur.n.forEach((x,i)=>{const nn=norm(x).trim();if(nn&&t.includes(nn))p=i});
 if(p<0){if(k.some(w=>w=="bir"||w=="birinci"||w=="1"))p=0;else if(k.some(w=>w=="iki"||w=="ikinci"||w=="2"))p=1}
 if(ty=="ace"||ty=="df")p=sv;
 if(p<0){say("hangi oyuncu? adını ya da bir/iki söyle");return}
 const L={ace:"ace",df:"çift hata",fe:"zorlanmış hata",ue:"basit hata",w:"winner",pt:"sayı"};
 say(L[ty]+" · "+cur.n[p]);add(ty,p)}
let DICT=null,noLang=false;
if(window.claude&&claude.use)claude.use("dictation").then(d=>{DICT=d;if(!d)return;d.onFinal(e=>{if(vOn&&view=="match"&&cur)voice(e.text)});d.onState(e=>{vOn=e.state!="idle";if(view=="match")render()})}).catch(()=>{});
let rec=null;
function micWeb(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){vmsg("Bu tarayıcı sesli girişi desteklemiyor.");return}
 if(vOn){vOn=false;try{rec.stop()}catch(e){}render();return}
 rec=new SR();rec.lang="tr-TR";rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)voice(e.results[i][0].transcript)};
